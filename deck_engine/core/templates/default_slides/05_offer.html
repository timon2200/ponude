<section class="slide" data-slide="5" data-index="5" data-title="{{SLIDE_5_TITLE}}">
  <div>
    <div class="category-badge-row">
      <span class="category-badge">{{SLIDE_5_CATEGORY}}</span>
      <span class="meta-coords">05 // INVESTICIJSKI PAKETI</span>
    </div>
    <h2 class="quote-title">{{SLIDE_5_HEADING}}</h2>
    <p class="quote-sub">{{SLIDE_5_SUB}}</p>
  </div>

  <div class="offer-package-grid">
    <div class="offer-main-card">
      {{OFFER_ITEMS_HTML}}
    </div>
    <div class="offer-total-box">
      <div class="offer-total-header">
        <span style="font-family:var(--font-mono); font-size:0.85rem; font-weight:800;">UKUPNO ZA PLAĆANJE</span>
        <span class="price" style="font-family:var(--font-hero); font-size:1.8rem; font-weight:900;">{{TOTAL_PRICE}}</span>
      </div>
      <div style="font-family:var(--font-mono); font-size:0.75rem; color:var(--text-secondary); line-height:1.4; border-top:1px dashed var(--accent-green-border); padding-top:0.6rem; margin-top:0.5rem;">
        • Oslobođeno PDV-a temeljem članka 90. st. 2 Zakona o PDV-u.<br>
        • Neograničena autorska prava korištenja.<br>
        • Rok valjanosti ponude: 30 dana.
      </div>
    </div>
  </div>
</section>
